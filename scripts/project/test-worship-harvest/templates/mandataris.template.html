<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
    <title>Mandatarissen</title>
</head>
<body>
<div prefix="xsd: http://www.w3.org/2001/XMLSchema# foaf: http://xmlns.com/foaf/0.1/ skos: http://www.w3.org/2004/02/skos/core# schema: http://schema.org/ ns1: http://data.lblod.info/vocabularies/contacthub/ ns2: http://data.vlaanderen.be/ns/mandaat# ns3: http://www.w3.org/ns/locn# ns5: http://data.lblod.info/vocabularies/erediensten/ ns6: https://data.vlaanderen.be/ns/adres# ns7: http://www.w3.org/ns/adms# ns9: http://www.w3.org/ns/org# ns10: https://data.vlaanderen.be/ns/persoon# ns11: http://www.w3.org/ns/person#">
    <h1>Mandatarissen - {{BESTUUR_LABEL}} (test {{RUN_ID}})</h1>

    <h2>{{FIRSTNAME}} {{FAMILYNAME}}</h2>
    <div typeof="ns1:AgentInPositie ns2:Mandataris ns5:EredienstMandataris" resource="{{URI}}">
        <div property="ns2:start" datatype="xsd:dateTime" content="2026-04-14T12:00:00+02:00"></div>
        <div property="ns2:einde" datatype="xsd:dateTime" content="2032-04-01T12:00:00+02:00"></div>
        <div property="ns5:geplandeEinddatumAanstelling" datatype="xsd:date" content="2032-04-01"></div>
        <div property="ns9:holds" resource="{{MANDAAT_URI}}">mandaat: {{ROL_LABEL}}</div>
        <div property="ns2:status" resource="http://data.vlaanderen.be/id/concept/MandatarisStatusCode/21063a5b-912c-4241-841c-cc7fb3c73e75">effectief</div>
        <div property="ns2:isBestuurlijkeAliasVan" resource="{{PERSON_URI}}">
            <div typeof="ns11:Person" resource="{{PERSON_URI}}">
                <div property="foaf:familyName" content="{{FAMILYNAME}}">Achternaam: {{FAMILYNAME}}</div>
                <div property="ns10:gebruikteVoornaam" content="{{FIRSTNAME}}">Voornaam: {{FIRSTNAME}}</div>
                <div property="ns10:heeftNationaliteit" resource="http://publications.europa.eu/resource/authority/country/BEL">Nationaliteit: Belgi&#xEB;</div>
                <div property="ns10:geslacht" resource="http://publications.europa.eu/resource/authority/human-sex/MALE">Mannelijk</div>
                <div property="ns7:identifier" resource="{{IDENTIFIER_URI}}">
                    <div typeof="ns7:Identifier" resource="{{IDENTIFIER_URI}}">
                        <div property="skos:notation" content="{{RRN}}"></div>
                    </div>
                </div>
                <div property="ns10:heeftGeboorte" resource="{{GEBOORTE_URI}}">
                    <div typeof="ns10:Geboorte" resource="{{GEBOORTE_URI}}">
                        <div property="ns10:datum" datatype="xsd:date" content="{{BIRTHDATE}}"></div>
                    </div>
                </div>
            </div>
        </div>
        <div property="schema:contactPoint" resource="{{CONTACT_URI}}">
            <div typeof="schema:ContactPoint" resource="{{CONTACT_URI}}">
                <div property="schema:contactType" content="Primary">primaire contactgegevens</div>
                <div property="schema:email" content="{{EMAIL}}">email: {{EMAIL}}</div>
                <div property="schema:telephone" content="{{PHONE}}">telefoon: {{PHONE}}</div>
                <div property="ns3:address" resource="{{ADDRESS_URI}}">
                    <div typeof="ns3:Address" resource="{{ADDRESS_URI}}">
                        <div property="ns3:thoroughfare" content="Teststraat"></div>
                        <div property="ns6:Adresvoorstelling.huisnummer" content="{{NUMBER}}"></div>
                        <div property="ns3:postCode" content="1000"></div>
                        <div property="ns6:gemeentenaam" content="Brussel"></div>
                        <div property="ns6:land" content="Belgi&#xEB;" lang="nl"></div>
                        <div property="ns3:fullAddress" content="Teststraat {{NUMBER}}, 1000 Brussel"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
